name: Common CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go ${{ matrix.go-version }}
    runs-on: ubuntu-latest

    env:
      # Use exactly the Go version from the matrix. Without this, Go 1.21+
      # silently downloads a newer toolchain when go.mod asks for one.
      GOTOOLCHAIN: local

    strategy:
      fail-fast: false
      matrix:
        go-version:
          - "1.18" # oldest supported version (first with generics)
          - oldstable
          - stable

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify formatting
        if: matrix.go-version == 'stable'
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run tests with race detector and coverage
        run: |
          go test \
            -race \
            -covermode=atomic \
            -coverprofile=coverage.out \
            ./...

      - name: Show coverage
        run: |
          echo "Total coverage:"
          go tool cover -func=coverage.out | grep total

      - name: Enforce minimum 80% coverage
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | awk '/^total:/ {sub("%","",$3); print $3}')

          echo "Coverage: ${COVERAGE}%"

          awk -v c="$COVERAGE" 'BEGIN {
              if (c < 80) {
                  printf("Coverage %.2f%% is below the required 80%%.\n", c)
                  exit 1
              }
          }'

      - name: Upload coverage to Codecov
        # Pull requests from forks get no secrets, so skip them instead of failing.
        if: >-
          success() &&
          matrix.go-version == 'stable' &&
          (github.event_name == 'push' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.out
          flags: common
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true